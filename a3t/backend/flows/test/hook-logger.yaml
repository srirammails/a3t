document:
  dsl: 1.0.3
  namespace: a3t
  name: a3t-test-hook-logger
  version: 1.0.0
  metadata:
    description: >
      Test hook logger — logs caller, phase, and timestamp.
      Used to verify extension hooks fire correctly.
do:
- log-entry:
    set:
      hook_log:
        caller: ${ .caller // "unknown" }
        phase: ${ .phase // "unknown" }
        agent_id: ${ .agent_id // "unknown" }
        message: ${ .message // "hook fired" }
        timestamp: "logged"
    export:
      as: "."
