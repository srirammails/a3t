- create-orgs:
    call: lancedb
    with:
      operation: create_table
      table: orgs
      mode: create_if_not_exists
      schema:
        id: string
        name: string
        slug: string
        plan: string
        settings: string
        created_at: string
        updated_at: string
      _resource: a3t/a3t-platform-db
- create-users:
