document:
  dsl: 1.0.3
  namespace: a3t
  name: a3t-projects-install
  version: 1.0.0
  metadata:
    description: >
      Tables for profiles, org members and projects in the platform DB (orgs
      already exists, from a3t-schema-install). Idempotent. Superadmin only.
do:
- whoami:
    set:
      _super: '${ (($context._principal // {}).roles // []) | index("SuperAdmin") != null }'
    export:
      as: "."
- check:
    switch:
    - not-super:
        when: '${ $context._super != true }'
        then: deny
    - default:
        then: create-orgs
- deny:
    set:
      ok: false
      error: Installing the project tables needs the SuperAdmin role.
    then: end
# orgs normally comes from a3t-schema-install; created here too so a fresh
# platform DB works (same schema, a no-op when it exists).
- create-orgs:
    call: lancedb
    with:
      operation: create_table
      table: orgs
      mode: create_if_not_exists
      schema:
        id: string
        name: string
        slug: string
        plan: string
        settings: string
        created_at: string
        updated_at: string
      _resource: a3t/a3t-platform-db
- create-profiles:
    call: lancedb
    with:
      operation: create_table
      table: profiles
      mode: create_if_not_exists
      schema:
        handle: string
        user_id: string
        email: string
        name: string
        created_at: string
      _resource: a3t/a3t-platform-db
- create-org-members:
    call: lancedb
    with:
      operation: create_table
      table: org_members
      mode: create_if_not_exists
      schema:
        id: string
        org_id: string
        user_id: string
        email: string
        name: string
        role: string
        added_by: string
        created_at: string
      _resource: a3t/a3t-platform-db
- create-projects:
    call: lancedb
    with:
      operation: create_table
      table: projects
      mode: create_if_not_exists
      schema:
        namespace: string
        owner_kind: string
        owner: string
        owner_id: string
        name: string
        display_name: string
        description: string
        private: string
        members: string
        policy: string
        environments: string
        created_by: string
        created_at: string
        updated_at: string
      _resource: a3t/a3t-platform-db
- done:
    set:
      ok: true
      tables: [orgs, profiles, org_members, projects]
