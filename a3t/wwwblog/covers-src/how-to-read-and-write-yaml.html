<!doctype html><html><head><meta charset="utf-8">
<!-- Cover for how-to-read-and-write-yaml. Screenshot at 1200x627 to public/covers/how-to-read-and-write-yaml.png. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:627px;overflow:hidden;background:#faf9f6}
body{background-image:linear-gradient(#ece8dd 1px,transparent 1px),linear-gradient(90deg,#ece8dd 1px,transparent 1px);background-size:40px 40px}
.title{position:absolute;left:64px;top:70px;width:440px}
.kicker{font:500 15px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#6e6a60;text-transform:uppercase}
h1{margin:16px 0 0;font:500 62px/1.04 'Playfair Display',Georgia,serif;letter-spacing:-.02em;color:#0f0f0f}
h1 em{color:#c47028}
.sub{margin-top:22px;font:500 16px/1.6 'IBM Plex Mono',monospace;color:#6e6a60}
.card{position:absolute;right:44px;top:70px;width:500px;padding:26px 30px;border-radius:16px;background:#fff;border:2px solid #e2ddd0;box-shadow:0 20px 50px rgba(40,30,10,.10);transform:rotate(-1.5deg)}
.file{font:600 14px 'IBM Plex Mono',monospace;color:#9a958a;margin-bottom:12px}
pre{margin:0;font:500 21px/1.62 'IBM Plex Mono',monospace;color:#0f0f0f;position:relative}
.k{color:#1a3fa8}.d{color:#9a958a}.s{color:#0a7a5a}.e{color:#c47028}
.g{display:inline-block;width:2ch;height:1.62em;vertical-align:top;box-shadow:inset 2px 0 0 #ecdcc8}
.tag{position:absolute;font:600 13px 'IBM Plex Mono',monospace;padding:4px 10px;border-radius:999px}
.t1{right:-22px;top:66px;background:#eaf1ff;color:#1a3fa8}
.t2{right:-22px;top:214px;background:#fbf0e0;color:#7a4710}
.t3{right:-22px;top:316px;background:#e3f4ef;color:#0a4c3a}
</style></head><body>
<div class="title"><div class="kicker">A3T · Blog</div><h1>How to read<br>and write <em>YAML</em></h1>
<div class="sub">maps · lists · indentation<br>quotes · multi-line · gotchas</div></div>
<div class="card"><div class="file">process-order.yaml</div>
<pre><span class="k">document</span>:
<span class="g"></span><span class="k">name</span>: process-order
<span class="g"></span><span class="k">version</span>: <span class="s">'1.0.0'</span>
<span class="k">do</span>:
<span class="g"></span><span class="d">- </span><span class="k">price</span>:
<span class="g"></span><span class="g"></span><span class="g"></span><span class="k">set</span>:
<span class="g"></span><span class="g"></span><span class="g"></span><span class="g"></span><span class="k">total</span>: <span class="e">${ .sum }</span>
<span class="g"></span><span class="d">- </span><span class="k">charge</span>:
<span class="g"></span><span class="g"></span><span class="g"></span><span class="k">call</span>: http
<span class="g"></span><span class="g"></span><span class="g"></span><span class="k">with</span>: { <span class="k">method</span>: post }</pre>
<span class="tag t1">map</span><span class="tag t2">list</span><span class="tag t3">nested</span>
</div>
</body></html>
