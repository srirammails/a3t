document:
  dsl: 1.0.3
  namespace: default
  name: test-state
  version: 1.0.0
do:
- set-state:
    call: state:set
    with:
      key: test:state:fixed-key
      value: hello world
- get-state:
    call: state:get
    with:
      key: test:state:fixed-key
    export:
      as: '{retrieved_value: .}'
- delete-state:
    call: state:delete
    with:
      key: test:state:fixed-key
- compile-results:
    set:
      state_test_completed: true
    export:
      as: .
