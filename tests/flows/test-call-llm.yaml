document:
  dsl: 1.0.3
  namespace: default
  name: test-call-llm
  version: 1.0.0
do:
- llm-call:
    call: llm
    with:
      prompt: What is 2+2? Reply with just the number.
      max_tokens: 50
      _resource: openai-gpt
    export:
      as: .
- compile-results:
    set:
      llm_test_completed: true
      llm_content: ${ .content }
      llm_model: ${ .model }
    export:
      as: .
