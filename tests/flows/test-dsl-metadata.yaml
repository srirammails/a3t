document:
  dsl: 1.0.3
  namespace: default
  name: test-dsl-metadata
  version: 1.0.0
do:
- with-metadata:
    set:
      result: ${ .value + 1 }
      workflow_info: ${ $workflow.name }
    export:
      as: .
input:
  schema:
    type: object
    properties:
      value:
        type: number
    required:
    - value
