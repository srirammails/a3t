# Primary Dragonfly instance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-primary
  namespace: flowr
  labels:
    app: dragonfly
    role: primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly
      role: primary
  template:
    metadata:
      labels:
        app: dragonfly
        role: primary
    spec:
      containers:
        - name: dragonfly
          image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
          args:
            - --logtostderr
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-primary
  namespace: flowr
  labels:
    app: dragonfly
    role: primary
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: dragonfly
    role: primary
# Secondary Dragonfly instance (replica)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-secondary
  namespace: flowr
  labels:
    app: dragonfly
    role: secondary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly
      role: secondary
  template:
    metadata:
      labels:
        app: dragonfly
        role: secondary
    spec:
      containers:
        - name: dragonfly
          image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
          args:
            - --logtostderr
            - --replicaof
            - dragonfly-primary.flowr.svc.cluster.local:6379
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-secondary
  namespace: flowr
  labels:
    app: dragonfly
    role: secondary
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: dragonfly
    role: secondary
# Combined service for reads (load balances across both)
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly
  namespace: flowr
  labels:
    app: dragonfly
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: dragonfly
