apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight
  namespace: flowr
  labels:
    app: redis-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-insight
  template:
    metadata:
      labels:
        app: redis-insight
    spec:
      containers:
        - name: redis-insight
          image: redis/redisinsight:latest
          ports:
            - containerPort: 5540
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-insight
  namespace: flowr
spec:
  type: ClusterIP
  ports:
    - port: 5540
      targetPort: 5540
      name: http
  selector:
    app: redis-insight
