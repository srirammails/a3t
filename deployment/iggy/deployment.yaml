---
apiVersion: v1
kind: Namespace
metadata:
  name: flowr
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iggy
  namespace: flowr
  labels:
    app: iggy
    component: messaging
spec:
  serviceName: iggy
  replicas: 1
  selector:
    matchLabels:
      app: iggy
  template:
    metadata:
      labels:
        app: iggy
        component: messaging
    spec:
      containers:
        - name: iggy
          image: apache/iggy:edge
          imagePullPolicy: Always
          ports:
            - name: tcp
              containerPort: 8090
              protocol: TCP
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: IGGY_HTTP_ENABLED
              value: "true"
            - name: IGGY_HTTP_ADDRESS
              value: "0.0.0.0:3000"
            - name: IGGY_TCP_ENABLED
              value: "true"
            - name: IGGY_TCP_ADDRESS
              value: "0.0.0.0:8090"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: iggy-data
              mountPath: /data
            - name: iggy-config
              mountPath: /iggy/configs/server.toml
              subPath: server.toml
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: iggy-config
          configMap:
            name: iggy-config
  volumeClaimTemplates:
    - metadata:
        name: iggy-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
