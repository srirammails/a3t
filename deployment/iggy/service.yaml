---
apiVersion: v1
kind: Service
metadata:
  name: iggy
  namespace: flowr
  labels:
    app: iggy
spec:
  type: ClusterIP
  selector:
    app: iggy
  ports:
    - name: tcp
      port: 8090
      targetPort: tcp
      protocol: TCP
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: iggy-headless
  namespace: flowr
  labels:
    app: iggy
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: iggy
  ports:
    - name: tcp
      port: 8090
      targetPort: tcp
    - name: http
      port: 3000
      targetPort: http
