[package]
name = "flowr-aesop"
description = "A3T EE glue: CedarHook implementing CE's flowr_policy::PolicyHook via aesop_core::AuthzEngine"
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[dependencies]
# CE contract crate (the seam we implement). Dependency direction: flowr-ee → CE.
flowr-policy = { path = "../../../shared/flowr-policy" }
# AESOP decision core with the Cedar engine. Direction: flowr-ee → aesop.
aesop-core = { path = "../../../../AESOP/crates/aesop-core", features = ["cedar"] }
async-trait = "0.1"
tracing = "0.1"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
