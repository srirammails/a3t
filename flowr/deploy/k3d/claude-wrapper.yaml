apiVersion: v1
kind: Service
metadata:
  name: claude-wrapper
  namespace: a3t
  labels:
    app: claude-wrapper
spec:
  type: NodePort
  selector:
    app: claude-wrapper
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-wrapper
  namespace: a3t
  labels:
    app: claude-wrapper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-wrapper
  template:
    metadata:
      labels:
        app: claude-wrapper
    spec:
      containers:
        - name: claude-wrapper
          image: claude-wrapper:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "8000"
            - name: CLAUDE_CWD
              value: "/workspace"
            - name: CLAUDE_AUTH_METHOD
              value: "cli"
            - name: VERBOSE
              value: "true"
            # Makes claude-cli-max agentic: attaches FlowR MCP (HTTP) and allows its tools
            - name: A3T_MCP_URL
              value: "http://flowr.a3t.svc.cluster.local:3002/message"
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: claude-auth
              mountPath: /root/.claude
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: claude-auth
          hostPath:
            path: /root/.claude
            type: DirectoryOrCreate
