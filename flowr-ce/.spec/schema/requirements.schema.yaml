$schema: http://json-schema.org/draft-07/schema#
title: ClawdFlow CNCF SWF Runtime Requirements
type: object
required: [project, version, requirements]
properties:
  project: { type: string }
  version: { type: string }
  requirements:
    type: array
    items:
      type: object
      required: [id, kind, priority, statement, acceptance_criteria]
      properties:
        id:
          type: string
          pattern: "^REQ-[A-Z]+-[0-9]{3}$"
          description: "Unique requirement ID: REQ-<AREA>-<NNN>"
        kind:
          enum: [behavior, invariant, sla, interface, security, conformance]
          description: "behavior=what it does, invariant=what must always hold, conformance=CNCF spec compliance"
        priority:
          enum: [must, should, may]
          description: "RFC 2119 priority"
        statement:
          type: string
          maxLength: 500
          description: "Single sentence describing the requirement"
        acceptance_criteria:
          type: array
          minItems: 1
          items: { type: string }
          description: "Observable outcomes that prove the requirement is met"
        tests:
          type: array
          items: { type: string }
          description: "Scenario tags that test this requirement"
        cncf_ref:
          type: string
          description: "Reference to CNCF SWF spec section (e.g. dsl-reference.md#call)"
