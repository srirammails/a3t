[tool.poetry]
name = "claude-wrapper"
version = "0.1.0"
description = "Claude Code as an OpenAI-compatible LLM endpoint for A3T"
authors = ["A3T"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
claude-agent-sdk = ">=0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
