[package]
name = "swf-runtime"
description = "CNCF Serverless Workflow Runtime — pluggable execution engine traits"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"

[dependencies]
swf-parser = { path = "../swf-parser" }
flowr-policy = { path = "../flowr-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
async-recursion = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["time", "process"] }
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
flowr-expr = { path = "../flowr-expr" }
async-trait = "0.1"
