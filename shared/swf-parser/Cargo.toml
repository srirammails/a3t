[package]
name = "swf-parser"
description = "CNCF Serverless Workflow DSL 1.0.3 Parser — pure parsing, no execution"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
