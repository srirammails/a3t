[package]
name = "flowr-mcp-core"
description = "FlowR MCP Core - Shared MCP protocol and tools for workflow engines"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["FlowR Team"]
license = "MIT"

[dependencies]
# Shared crates
flowr-types = { path = "../flowr-types" }
flowr-policy = { path = "../flowr-policy" }
flowr-storage = { path = "../flowr-storage" }
flowr-expr = { path = "../flowr-expr" }

# Async
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Logging
tracing = "0.1"

# Utilities
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
