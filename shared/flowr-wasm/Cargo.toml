[package]
name = "flowr-wasm"
description = "FlowR-CE WASM task runtime — load & run sandboxed WASM task handlers (CE infra; EE adds Cedar control)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
swf-runtime = { path = "../swf-runtime" }
swf-parser = { path = "../swf-parser" }
# wasmtime: pure-Rust WASM embedder. Core-module ABI today; the component model
# (capability-safe WIT interfaces) is the planned upgrade — hence a full-featured
# embedder rather than a bare interpreter.
wasmtime = "27"
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
