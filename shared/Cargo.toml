[workspace]
resolver = "2"
members = [
    "swf-parser",
    "swf-runtime",
    "flowr-expr",
    "flowr-types",
    "flowr-storage",
    "flowr-storage-dragonfly",
    "flowr-core",
    "flowr-mcp-core",
    "flowr-wasm",
    "flowr-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["FlowR Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Utilities
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Expression engine (jaq)
jaq-core = "2.0"
jaq-std = "2.0"
jaq-json = { version = "1.0", features = ["serde_json"] }

# YAML
serde_yaml = "0.9"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Utilities for tasks
tempfile = "3.10"
tokio-util = { version = "0.7", features = ["rt"] }

# gRPC
tonic = "0.12"
prost = "0.13"

# Internal crates
flowr-types = { path = "flowr-types" }
flowr-expr = { path = "flowr-expr" }
flowr-storage = { path = "flowr-storage" }
flowr-core = { path = "flowr-core" }
flowr-mcp-core = { path = "flowr-mcp-core" }

# External crates (for embedded ClawDB support)
clawdb = { path = "../../AQL/crates/clawdb" }
aql-parser = { path = "../../AQL/crates/aql-parser" }
