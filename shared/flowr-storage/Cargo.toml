[package]
name = "flowr-storage"
description = "Storage trait abstractions for FlowR workflow engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flowr-types = { workspace = true, optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
futures.workspace = true
tokio = { workspace = true, optional = true }

[features]
default = ["backend"]
# The storage backends' traits (FlowR's types). ADB uses the engine without them.
backend = ["dep:flowr-types"]
# The engine-store conformance suite, for backends' tests.
conformance = ["dep:tokio"]

[dev-dependencies]
tokio.workspace = true
