[package]
name = "flowr-core"
description = "FlowR Core - Shared executor and task abstractions"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Shared crates
flowr-expr = { path = "../flowr-expr" }
flowr-types = { path = "../flowr-types" }
flowr-storage = { path = "../flowr-storage" }

# Async runtime
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true

# Utilities
uuid.workspace = true
chrono.workspace = true

# HTTP client for call:http tasks
reqwest = { version = "0.12", features = ["json"] }

# JSON Schema validation (CNCF spec: input.schema, output.schema, export.schema)
jsonschema = "0.29"
